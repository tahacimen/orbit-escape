<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b1f">
  <title>Orbit Escape</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" aria-live="polite">
    <canvas id="game" aria-label="Orbit Escape oyun alanı"></canvas>
    <section id="home" class="screen home-screen">
      <p class="eyebrow">İÇTEN DIŞA KAÇ</p>
      <h1>ORBIT<br><span>ESCAPE</span></h1>
      <div class="preview-orbit" aria-hidden="true"><i></i><b></b></div>
      <button id="play-button" class="primary">OYNA</button>
      <div class="split-actions">
        <button id="levels-button" class="secondary">BÖLÜMLER</button>
        <button id="settings-button" class="secondary">AYARLAR</button>
      </div>
      <p id="last-level" class="muted"></p>
    </section>

    <section id="levels" class="screen panel-screen hidden" aria-label="Bölümler">
      <header><button class="icon-button back-home" aria-label="Ana sayfaya dön">‹</button><h2>BÖLÜMLER</h2><span></span></header>
      <div id="level-grid" class="level-grid"></div>
    </section>

    <section id="settings" class="screen panel-screen hidden" aria-label="Ayarlar">
      <header><button class="icon-button back-home" aria-label="Ana sayfaya dön">‹</button><h2>AYARLAR</h2><span></span></header>
      <div class="settings-card">
        <label><span>Ses efektleri</span><input id="sound-toggle" type="checkbox" checked></label>
        <label><span>Titreşim</span><input id="haptics-toggle" type="checkbox" checked></label>
        <label><span>Hareketi azalt</span><input id="motion-toggle" type="checkbox"></label>
      </div>
      <p class="muted settings-note">Renkler tek başına bilgi taşımaz: açık geçit kesik biçimde, kapalı yüzey düz biçimde gösterilir.</p>
    </section>

    <section id="hud" class="hud hidden" aria-label="Oyun bilgileri">
      <div class="hud-top"><button id="quit-button" class="icon-button" aria-label="Bölümlere dön">‹</button><div><p id="level-label">BÖLÜM 1</p><strong id="escape-label">KAÇIŞ 0 / 3</strong><small id="combo-label">AKIŞ x0 · 0 PUAN</small></div><button id="pause-button" class="icon-button" aria-label="Oyunu duraklat">Ⅱ</button></div>
      <div class="hud-bottom"><div id="lives" aria-label="Hata hakkı"></div><p>Kaydır: nişan al · Dokun: ateş et</p></div>
    </section>

    <section id="result" class="result hidden" role="dialog" aria-modal="true">
      <div class="result-card">
        <div id="result-symbol" class="result-symbol"></div>
        <h2 id="result-title"></h2><p id="result-copy"></p><strong id="result-stars"></strong>
        <button id="result-primary" class="primary"></button>
        <button id="result-exit" class="text-button">BÖLÜMLERE DÖN</button>
      </div>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
